<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --fg: #1f2328;
        --muted: #57606a;
        --border: #d0d7de;
        --bg: #fff;
        --accent: #2f81f7;
      }
      body {
        font: 13px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 12px;
        width: 300px;
        background: var(--bg);
        color: var(--fg);
        border-radius: 8px;
        overflow: hidden;
      }
      h3 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
      }
      #status {
        line-height: 1.4;
        text-align: center;
      }
      #status:has(~ #action:not([hidden])) {
        margin-bottom: 8px;
      }
      button {
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
        cursor: pointer;
        font: inherit;
      }
      #action {
        width: 100%;
        background: var(--accent);
        color: #fff;
        border: none;
      }
      .msg {
        margin-top: 8px;
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #fcf7e6;
      }
      .msg.error {
        background: #ffeef0;
        color: #86181d;
        border-color: #ffdce0;
      }
      #hosts-header {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }
      ul {
        list-style: none;
        padding-left: 0;
        margin: 0;
        max-height: 200px;
        overflow: auto;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px dashed #f0f2f4;
      }
      li button {
        height: 24px;
        padding: 0 8px;
        font-size: 12px;
      }
      .host {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', 'Courier New', monospace;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .footer a {
        color: var(--accent);
        text-decoration: none;
        font-size: 12px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <h3>Git Well Soon</h3>

    <div class="card">
      <div id="status" aria-live="polite"></div>
      <button id="action" hidden></button>
      <div id="msg" class="msg" aria-live="polite" hidden></div>
    </div>

    <div id="hosts-card" class="card" hidden>
      <div id="hosts-header">Enabled hosts</div>
      <ul id="list"></ul>
    </div>

    <div class="footer">
      <a
        href="https://chromewebstore.google.com/detail/git-well-soon/ehpeaofieafibmhiagianfjjblpnmbdo/reviews"
        target="_blank"
        rel="noopener noreferrer"
      >
        ⭐ Rate on Chrome Web Store
      </a>
      <a
        href="https://github.com/cduflo/gitwellsoon/issues"
        target="_blank"
        rel="noopener noreferrer"
      >
        🐛 Submit issues
      </a>
    </div>

    <script src="popup-lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
