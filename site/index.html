<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Local Test Routes</title>
    <style>
      body { font: 14px -apple-system, system-ui, Segoe UI, Roboto, Arial; padding: 16px; }
      ul { line-height: 1.8; }
      code { background: #f6f8fa; padding: 2px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Local Test Routes</h1>
    <p>Use these links to simulate GitHub-like paths. The extension should add <code>?w=1</code> on PR files routes.</p>
    <ul>
      <li><a href="/owner/repo/pull/123/files">/owner/repo/pull/123/files</a></li>
      <li><a href="/owner/repo/pull/123/changes">/owner/repo/pull/123/changes</a></li>
      <li><a href="/owner/repo/compare">/owner/repo/compare</a></li>
      <li><a href="/owner/repo/commits/main">/owner/repo/commits/main</a></li>
      <li><a href="/owner/repo/commit/abc">/owner/repo/commit/abc</a></li>
    </ul>
  </body>
</html>
